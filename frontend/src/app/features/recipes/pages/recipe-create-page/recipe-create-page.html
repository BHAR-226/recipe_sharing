<div class="create-page-container container">
  <!-- Breadcrumb & Header -->
  <div class="page-top-bar">
    <a routerLink="/recipes" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Retour aux recettes</span>
    </a>
  </div>

  <div class="create-header">
    <span class="gold-badge">Nouvelle Publication</span>
    <h1 class="page-title">Partager une Recette</h1>
    <p class="page-subtitle">
      Racontez les secrets de votre plat, détaillez chaque ingrédient et guidez les membres pas à pas.
    </p>
  </div>

  <!-- Alerts -->
  @if (message) {
    <div class="alert alert-success">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>{{ message }} Redirection vers votre recette...</span>
    </div>
  }

  @if (errorMessage) {
    <div class="alert alert-error">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>
  }

  <!-- Form Component -->
  <app-recipe-form 
    submitLabel="Publier ma recette"
    [isSubmitting]="isSubmitting"
    (submitted)="createRecipe($event)" 
  />
</div>
