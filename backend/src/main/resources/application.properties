spring.application.name=recipe-sharing
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/recipe_sharing}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PostgreSql-226}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT configuration
jwt.secret=${JWT_SECRET:bhar-recipenet-secret-key-gastronomie-gold-signature-2026-very-secure}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# File upload configuration
app.upload.dir=${APP_UPLOAD_DIR:uploads/images}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Server port (provided automatically by Render/Cloud platforms via PORT env variable)
server.port=${PORT:8080}

